base_url = "https://rgit.rs"
title = "Rabun Git"
description = "Rgit is Git with etiquette. Self-hosted forge: SSH remotes, Conventional Commits, SemVer 2.0, merge requests, and YAML workflows."
theme = "devlab-theme"

compile_sass = true

[link_checker]
skip_prefixes = [
    "https://github.com/Burton-Workspaces/",
    "https://github.com/rconnelly/rgit",
]

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra.brand]
id = "rabun"

[extra.devlab.brand]
logo_text = "Rabun Git"
footer_text = "Rabun Git"
show_logo_mark = true
logo_mark_path = "/brand/rabun.svg"

[extra.devlab.footer]
show = true
note = "Rgit is Git with etiquette. MIT licensed."
links_label = "Project"
links = [
  { name = "Burton", path = "https://burton.work" },
  { name = "GitHub", path = "https://github.com/rconnelly/rgit", icon = "github" },
]

[extra.releases]
# github: link GitHub Releases for the associated repo. pack: host a source tarball.
mode = "github"
repo = "https://github.com/rconnelly/rgit"
url = "https://github.com/rconnelly/rgit/releases"

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Install", path = "/install/" },
  { name = "Docs", kind = "docs" },
  { name = "Rgit Web", path = "/web/" },
  { name = "Releases", path = "https://github.com/rconnelly/rgit/releases" },
  { name = "Burton", path = "https://burton.work" },
]

[extra.devlab.docs]
section = "docs/_index.md"
path = "/docs/"
get_started_path = "/install/"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.search]
enabled = false
