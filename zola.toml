base_url = "https://rgit.burtonapp.com"
title = "Rabun Git"
description = "Self-hosted git forge. SSH remotes, merge requests, and YAML workflows on your own builders."
theme = "devlab-theme"

compile_sass = true

[link_checker]
skip_prefixes = [
  "https://github.com/Burton-Workspaces/",
]

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra.brand]
id = "rabun"

[extra.devlab.brand]
logo_text = "Rabun Git"
footer_text = "Rabun Git"
show_logo_mark = true
logo_mark_path = "/brand/rabun.svg"

[extra.devlab.footer]
show = true
note = "Self-hosted git forge. MIT licensed."
links_label = "Project"
links = [
  { name = "Burton", path = "https://www.burtonapp.com" },
  { name = "GitHub", path = "https://github.com/rconnelly/rgit", icon = "github" },
]

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Docs", kind = "docs" },
  { name = "Releases", path = "/releases/" },
  { name = "Burton", path = "https://www.burtonapp.com" },
]

[extra.devlab.docs]
section = "docs/_index.md"
path = "/docs/"
get_started_path = "/docs/install/"

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.search]
enabled = false
